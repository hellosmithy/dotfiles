# Kitty-as-multiplexer bindings — DISABLED by default.
#
# herdr is the multiplexer now, so Kitty stays a bare rectangle: anything Kitty
# binds here never reaches herdr. To hand splits/tabs back to Kitty, uncomment
# the `include ./multiplexer.conf` line near the top of kitty.conf (and comment
# out the matching bindings in ~/.config/herdr/config.toml so they don't fight).

# Splits (ctrl+s prefix, tmux-style)
map ctrl+s>% launch --cwd=current
map ctrl+s>" launch --cwd=current
map ctrl+s>x close_window
map ctrl+s>z toggle_layout stack

# Vim-aware pane navigation via the pass_keys.py kitten
map ctrl+j kitten pass_keys.py bottom ctrl+j
map ctrl+k kitten pass_keys.py top    ctrl+k
map ctrl+h kitten pass_keys.py left   ctrl+h
map ctrl+l kitten pass_keys.py right  ctrl+l

# Resize
map kitty_mod+left resize_window narrower 3
map kitty_mod+right resize_window wider 3
map kitty_mod+up resize_window taller 3
map kitty_mod+down resize_window shorter 3

# Tabs
map ctrl+s>shift+] next_tab
map ctrl+s>shift+[ previous_tab
map ctrl+s>c new_tab
map ctrl+s>, set_tab_title

map ctrl+s>1 goto_tab 1
map ctrl+s>2 goto_tab 2
map ctrl+s>3 goto_tab 3
map ctrl+s>4 goto_tab 4
map ctrl+s>5 goto_tab 5
map ctrl+s>6 goto_tab 6
map ctrl+s>7 goto_tab 7
map ctrl+s>8 goto_tab 8
map ctrl+s>9 goto_tab 9
map ctrl+s>0 goto_tab 0
